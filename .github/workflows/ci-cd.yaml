name: CI/CD Pipeline

on:
  push:
    branches: ["final-main12"]      
    tags: ["v*"]                     
  pull_request:
    branches: ["final-main12"]

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ github.repository_owner }}/42-docker-final  
  GO_VERSION: "1.22"

jobs:
 
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Tidy modules (фиксация версии)
        run: go mod tidy -go=${{ env.GO_VERSION }}

      - name: Verify go.mod version
        run: |
          VERSION=$(grep "^go " go.mod | cut -d' ' -f2)
          if [ "$VERSION" != "${{ env.GO_VERSION }}" ]; then
            echo "Error: go.mod has go $VERSION, expected ${{ env.GO_VERSION }}"
            exit 1
          fi
          echo "go.mod version: $VERSION"

      - name: Run linter
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m
          skip-cache: true

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

  
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/')   
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64